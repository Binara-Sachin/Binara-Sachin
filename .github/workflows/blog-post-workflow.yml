name: Update README with latest blog posts

on:
  schedule:
    # Once a day at 00:00 UTC. Hourly is overkill for a Medium feed and
    # burns Actions minutes for nothing.
    - cron: "0 0 * * *"
  workflow_dispatch: # Allow manual runs from the Actions tab

permissions:
  contents: write # Needed to commit the regenerated README

jobs:
  update-readme-with-blog:
    name: Sync Medium posts into README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull in Medium posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@binara.sachin"
          max_post_count: 5

          # Off by default in this config: the action otherwise pushes
          # "dummy commit to keep the repository active" commits, which sit
          # in your public history forever and look exactly as good as they sound.
          enable_keepalive: false

          commit_message: "chore: sync latest blog posts"
          committer_username: "github-actions[bot]"
          committer_email: "41898282+github-actions[bot]@users.noreply.github.com"
